       página em vez da logo. O Chrome aceita webp, mas manter os dois

       abre em BRANCO. Por isso a lista — uma linha por tamanho de tela.

       Não dá pra juntar num arquivo só: o Safari não aceita sprite nem
       SVG aqui, tem que ser um PNG por tamanho. Elas moram todas em
       assets/abertura/, longe do resto, e saem de assets/simbolo-wa.svg.

       Aparelho novo no mercado? Mais uma linha em
       ferramentas/gerar-aberturas.js, roda, e mais um <link> aqui. Sem
       isso ele não quebra, só volta a abrir em branco naquele modelo. -->

       O Chart.js saiu daqui — quem o busca é o Resumo, quando abre. -->
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

       NUNCA ponha aqui a chave "service_role".

  <!-- ═══ OS MÓDULOS, E O QUE CADA UM FAZ ═══════════════════════════════
       Um por tela, mais dois de base. Tela nova = arquivo novo, e ele
       entra ANTES do embreve.js — que é quem tapa buraco de tela que
       ainda não existe, e sobrescreve quem vier depois dele.

         core.js       dinheiro, datas, navegação, carregamento, reservas
         categorias.js escolher categoria e criar uma sem sair da tela
         auth.js       entrar, criar conta, recuperar senha, sair
         resumo.js     Resumo do mês e o filtro de entradas/saídas
         lancamentos.js  lançar, editar e excluir — usado pelo Resumo e
                         pelo Histórico, por isso mora sozinho
         entradasfixas.js  o salário e o que mais entra todo mês
         contas.js     Contas a pagar
         historico.js  lista completa, mês a mês
         ajustes.js    perfil, senha, tema, plano, categorias, sair
         cartoes.js    cartões, faturas, compras e pagamentos
         metas.js      tetos por categoria, obrigatórios e opcionais
         fechamento.js fecha o mês e leva a sobra pro seguinte
         relatorios.js o retrato do mês — depois de metas.js e
                       fechamento.js, de quem ele toma as contas emprestadas
         reservas.js   dinheiro guardado fora da conta — depois de
                       relatorios.js, de quem ele toma o gasto médio do mês
         negocio.js    o negócio e os quatro números dele; só a retirada
                       atravessa pro dinheiro pessoal
         embreve.js    telas ainda por construir
         app.js        a partida: sessão, erros de carga, relógio

       O ?v=N no fim de cada um existe pra o celular não servir a versão
       velha do cache. Mexeu no arquivo, sobe o número. -->
  <script defer src="js/core.js?v=53"></script>
  <script defer src="js/categorias.js?v=2"></script>
  <script defer src="js/auth.js?v=2"></script>
  <script defer src="js/resumo.js?v=23"></script>
  <script defer src="js/lancamentos.js?v=14"></script>
  <script defer src="js/entradasfixas.js?v=6"></script>
  <script defer src="js/contas.js?v=15"></script>
  <script defer src="js/historico.js?v=3"></script>
  <script defer src="js/ajustes.js?v=6"></script>
  <script defer src="js/cartoes.js?v=20"></script>
  <script defer src="js/metas.js?v=13"></script>
  <script defer src="js/fechamento.js?v=4"></script>
  <script defer src="js/relatorios.js?v=18"></script>
  <script defer src="js/reservas.js?v=4"></script>
  <script defer src="js/negocio.js?v=1"></script>
  <script defer src="js/balanco.js?v=5"></script>

  <script defer src="js/embreve.js?v=8"></script>
