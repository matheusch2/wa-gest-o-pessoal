  <!-- ═══ OS MÓDULOS, E O QUE CADA UM FAZ ═══════════════════════════════
       Um por tela, mais dois de base. Tela nova = arquivo novo, e ele
       entra ANTES do embreve.js — que é quem tapa buraco de tela que
       ainda não existe, e sobrescreve quem vier depois dele.

         core.js       dinheiro, datas, navegação, carregamento, reservas
         categorias.js escolher categoria e criar uma sem sair da tela
         auth.js       entrar, criar conta, recuperar senha, sair
         resumo.js     Resumo do mês e o filtro de entradas/saídas
         lancamentos.js  lançar, editar e excluir — usado pelo Resumo e
                         pelo Histórico, por isso mora sozinho
         entradasfixas.js  o salário e o que mais entra todo mês
         contas.js     Contas a pagar
         historico.js  lista completa, mês a mês
         ajustes.js    perfil, senha, tema, plano, categorias, sair
         cartoes.js    cartões, faturas, compras e pagamentos
         metas.js      tetos por categoria, obrigatórios e opcionais
         fechamento.js fecha o mês e leva a sobra pro seguinte
         relatorios.js o retrato do mês — depois de metas.js e
                       fechamento.js, de quem ele toma as contas emprestadas
         reservas.js   dinheiro guardado fora da conta — depois de
                       relatorios.js, de quem ele toma o gasto médio do mês
         negocio.js    o negócio e os quatro números dele; só a retirada
                       atravessa pro dinheiro pessoal
         embreve.js    telas ainda por construir
         app.js        a partida: sessão, erros de carga, relógio

       O ?v=N no fim de cada um existe pra o celular não servir a versão
       velha do cache. Mexeu no arquivo, sobe o número. -->
