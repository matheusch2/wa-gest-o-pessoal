  ANTES DE USAR, troque as duas linhas marcadas com "TROQUE AQUI" lá embaixo
  pelos dados do SEU projeto no Supabase (Project Settings → API).

  A chave "publishable"/"anon" pode ficar aqui à vista — ela é feita para isso.
  Quem protege os dados é o RLS do banco.sql, não o segredo da chave.

  A chave "service_role" NUNCA pode entrar neste arquivo. Ela ignora o RLS e
  dá acesso a tudo de todo mundo. Ela vive só no servidor do Supabase.
-->
<html lang="pt-BR" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f3b5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="WA Finanças">
  <link rel="icon" href="assets/logo.webp">
  <link rel="apple-touch-icon" href="assets/logo.webp">
  <title>WA Finanças</title>

  <!-- Se alguém tentar embutir o site num iframe para roubar a sessão, quebra pra fora. -->
  <script>if (window.top !== window.self) { try { window.top.location = window.self.location; } catch (e) { document.documentElement.style.display = "none"; } }</script>

  <!-- Abre a conversa com o Supabase (DNS + TLS) enquanto a página ainda
       está sendo lida. Em 4G esse aperto de mão sozinho custa perto de meio
       segundo, e ele acontecia só depois de tudo carregado. -->
  <link rel="preconnect" href="https://efewoxdgfcgkodtqbqsz.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

  <link rel="stylesheet" href="style.css?v=34">

  <!-- defer: baixa em paralelo e só executa depois da página montada, em
       ordem. Sem ele, cada script trava a leitura do HTML no meio.
       O Chart.js saiu daqui — quem o busca é o Resumo, quando abre. -->
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="notranslate">

  <!-- ─── TOPO ─────────────────────────────────────────────────────── -->
  <header class="topo" id="topo" style="display:none">
    <div class="topo-dentro">
      <div class="topo-esq" onclick="voltarInicio()">
        <button id="btn-voltar" class="topo-voltar" style="display:none"
                aria-label="Voltar" onclick="event.stopPropagation(); voltarTela()">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="topo-marca">
          <div class="logo-circulo"><img src="assets/logo.webp" alt="WA Finanças"></div>
          <div class="topo-divisor"></div>
          <div>
            <h1>WA FINANÇAS</h1>
            <p>Seu dinheiro sob controle</p>
          </div>
        </div>
      </div>
      <button class="topo-perfil" onclick="abrirAjustes()" aria-label="Ajustes">
        <span id="iniciais">?</span>
      </button>
    </div>
  </header>

  <main id="cartao" class="cartao">
    <!-- Tela de entrada (login/cadastro/recuperar). Montada pelo script. -->
    <div id="area-login"></div>

    <!-- Menu principal. Só aparece depois de entrar. -->
    <nav id="menu" class="menu" style="display:none">
      <button class="menu-botao" onclick="abrirResumo()">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Resumo do mês
      </button>
      <button class="menu-botao" onclick="abrirLancar('saida')">
        <svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        Lançar saída
      </button>
      <button class="menu-botao" onclick="abrirLancar('entrada')">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
        Lançar entrada
      </button>
      <button class="menu-botao" onclick="abrirContas()">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Contas a pagar
      </button>
      <!-- Ajustes não fica aqui: o círculo com as iniciais, no canto superior
           direito, já abre essa tela. Dois caminhos pro mesmo lugar só
           ocupavam espaço no menu. -->
      <button class="menu-botao" onclick="abrirHistorico()">
        <svg viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="13" y2="15"/></svg>
        Histórico
      </button>
      <button class="menu-botao" onclick="abrirCartoes()">
        <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="3"/><line x1="1" y1="10" x2="23" y2="10"/><line x1="5" y1="15" x2="9" y2="15"/></svg>
        Cartão
      </button>
      <button class="menu-botao" onclick="abrirMetas()">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>
        Metas de gastos
      </button>
      <button class="menu-botao" onclick="abrirMeuPlano()">
        <svg viewBox="0 0 24 24"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3-5.5-3-5.5 3 1-6.3L3 8.9 9 8z"/></svg>
        Meu plano
      </button>
    </nav>

    <!-- Toda tela interna é desenhada aqui dentro. -->
    <div id="area" class="area"></div>
  </main>

  <div id="avisos" class="avisos" aria-live="polite"></div>

  <script>
    /* ══ TROQUE AQUI ══════════════════════════════════════════════════
       Supabase → seu projeto → Project Settings → API
       - URL do projeto
       - chave "publishable" (ou "anon public", nos projetos mais antigos)
       NUNCA ponha aqui a chave "service_role".
    ═══════════════════════════════════════════════════════════════════ */
    const SUPABASE_URL = "https://efewoxdgfcgkodtqbqsz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_qN3WztbmNH1Fzx4fyEqwYw_grooabFt";

  <!-- Módulos da aplicação. A ordem preserva as dependências compartilhadas. -->
  <script defer src="js/core.js?v=11"></script>
  <script defer src="js/auth.js?v=2"></script>
  <script defer src="js/resumo.js?v=11"></script>
  <script defer src="js/lancamentos.js?v=7"></script>
  <script defer src="js/contas.js?v=2"></script>
  <script defer src="js/historico.js?v=3"></script>
  <script defer src="js/ajustes.js?v=1"></script>
  <script defer src="js/cartoes.js?v=3"></script>
  <script defer src="js/metas.js?v=3"></script>
  <script defer src="js/fechamento.js?v=1"></script>

  <script defer src="js/app.js?v=3"></script>
</body>
</html>
